name: Build mcaddon

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Check
        run: npm run check

      - name: Build
        run: sh tools/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blockAI-mcaddon
          path: dist/

      # iPhone の Safari から直接ダウンロードできるように Release に置く
      # （Release が手で編集・作り直しされていても、ファイルを必ず置き直す）
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="latest-$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"
          VERSION="$(node -p "require('./package.json').version")"
          TITLE="blockAI v${VERSION} (${GITHUB_REF_NAME})"
          NOTES="ブランチ ${GITHUB_REF_NAME} の最新ビルド v${VERSION} (${GITHUB_SHA::7})。iPhone/iPad では下の Assets にある blockAI-v${VERSION}.mcaddon をタップして「Minecraft で開く」。"
          if gh release view "$TAG" >/dev/null 2>&1; then
            git push -f origin "HEAD:refs/tags/$TAG"
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease
            # 古い版のファイルを消す
            for a in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
              gh release delete-asset "$TAG" "$a" --yes
            done
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" --prerelease --title "$TITLE" --notes "$NOTES"
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "blockAI-v${VERSION}.mcaddon"
