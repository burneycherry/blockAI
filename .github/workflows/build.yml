name: Build mcaddon

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Check
        run: npm run check

      - name: Build
        run: sh tools/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blockAI-mcaddon
          path: dist/blockAI.mcaddon

      # iPhone の Safari から直接ダウンロードできるように Release に置く
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="latest-$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" dist/blockAI.mcaddon \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "blockAI (${GITHUB_REF_NAME})" \
            --notes "ブランチ ${GITHUB_REF_NAME} の最新ビルド (${GITHUB_SHA::7})。iPhone では blockAI.mcaddon をタップして「Minecraft で開く」。"
